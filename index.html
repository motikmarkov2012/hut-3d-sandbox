<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Просмотр — Баба Яга</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

    <header class="w-full p-6 flex justify-between items-center border-b border-zinc-800/60">
        <h1 class="text-sm font-medium tracking-widest uppercase text-zinc-400">Команда «Баба Яга»</h1>
        <span class="text-xs text-purple-400 bg-purple-950/60 px-2.5 py-1 border border-purple-800/60">v1.7 (Исправление масштаба SW)</span>
    </header>

    <main id="welcome-screen" class="flex-1 flex flex-col items-center justify-center px-4">
        <div class="max-w-md text-center space-y-6">
            <h2 class="text-3xl font-light tracking-tight text-white">Избушка Бабы Яги в AR</h2>
            <p class="text-sm text-zinc-400 leading-relaxed">
                Код принудительно уменьшил модель, чтобы компенсировать миллиметры из SolidWorks. Нажмите кнопку для запуска.
            </p>
            <div class="pt-4">
                <button id="open-ar-btn" class="w-full sm:w-auto px-8 py-4 bg-purple-600 hover:bg-purple-500 text-white font-medium text-sm tracking-wide rounded-none transition-colors duration-200 shadow-lg shadow-purple-950/50">
                    Запустить камеру (Масштаб 0.001)
                </button>
            </div>
        </div>
    </main>

    <div class="hidden">
        <model-viewer 
            id="ar-model-viewer"
            src="izbushka.glb" 
            scale="0.001 0.001 0.001" 
            ar
            ar-modes="scene-viewer quick-look"
            camera-controls>
        </model-viewer>
    </div>

    <script>
        const openArBtn = document.getElementById('open-ar-btn');
        const modelViewer = document.getElementById('ar-model-viewer');

        openArBtn.addEventListener('click', () => {
            if (modelViewer.canActivateAR) {
                modelViewer.activateAR();
            } else {
                modelViewer.activateAR().catch(() => {
                    alert('Откройте эту страницу со смартфона через Safari (iPhone) или Chrome (Android).');
                });
            }
        });
    </script>
</body>
</html>
