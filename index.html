<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Просмотр — Баба Яга</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

    <!-- Шапка -->
    <header class="w-full p-6 flex justify-between items-center border-b border-zinc-800/60">
        <h1 class="text-sm font-medium tracking-widest uppercase text-zinc-400">Команда «Баба Яга»</h1>
        <span class="text-xs text-zinc-500 bg-zinc-900 px-2.5 py-1 border border-zinc-800">v1.2 (Синяя версия)</span>
    </header>

    <!-- Главный экран с одной кнопкой -->
    <main id="welcome-screen" class="flex-1 flex flex-col items-center justify-center px-4">
        <div class="max-w-md text-center space-y-6">
            <h2 class="text-3xl font-light tracking-tight text-white">Избушка Бабы Яги в AR</h2>
            <p class="text-sm text-zinc-400 leading-relaxed">
                Нажмите кнопку ниже, чтобы включить камеру и поставить избушку перед собой.
            </p>
            <div class="pt-4">
                <!-- Кнопка теперь синяя (indigo) -->
                <button id="open-ar-btn" class="w-full sm:w-auto px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm tracking-wide rounded-none transition-colors duration-200 shadow-lg shadow-indigo-950/50">
                    Включить камеру и ходить вокруг модели
                </button>
            </div>
        </div>
    </main>

    <!-- Скрытый контейнер с model-viewer -->
    <div class="hidden">
        <model-viewer 
            id="ar-model-viewer"
            src="izbushka.glb" 
            scale="0.3 0.3 0.3"
            ar
            ar-modes="scene-viewer quick-look webxr"
            camera-controls>
        </model-viewer>
    </div>

    <!-- Скрипт автоматического запуска камеры при нажатии на кнопку -->
    <script>
        const openArBtn = document.getElementById('open-ar-btn');
        const modelViewer = document.getElementById('ar-model-viewer');

        openArBtn.addEventListener('click', () => {
            if (modelViewer.canActivateAR) {
                modelViewer.activateAR();
            } else {
                alert('К сожалению, режим дополненной реальности (камера) не поддерживается на этом устройстве или ПК. Пожалуйста, откройте сайт со смартфона (iPhone или Android).');
            }
        });
    </script>
</body>
</html>
