<!-- Шапка -->
<header class="w-full p-6 flex justify-between items-center border-b border-zinc-800/60 z-10">
    <h1 class="text-sm font-medium tracking-widest uppercase text-zinc-400">Команда «Баба Яга»</h1>
    <span class="text-xs text-rose-400 bg-rose-950/60 px-2.5 py-1 border border-rose-800/60">v2.0 (Интерактив и прозрачность)</span>
</header>

<!-- Основной экран -->
<main id="welcome-screen" class="flex-1 flex flex-col items-center justify-center px-4">
    <div class="max-w-md text-center space-y-6">
        <h2 class="text-3xl font-light tracking-tight text-white">Избушка Бабы Яги в AR</h2>
        <p class="text-sm text-zinc-400 leading-relaxed">
            В этой версии добавлена панель управления прозрачностью деталей для изучения внутренней структуры.
        </p>
        <div class="pt-4">
            <button id="open-ar-btn" class="w-full sm:w-auto px-8 py-4 bg-rose-600 hover:bg-rose-500 text-white font-medium text-sm tracking-wide rounded-none transition-colors duration-200 shadow-lg shadow-rose-950/50">
                Запустить камеру (AR)
            </button>
        </div>
    </div>
</main>

<!-- Контейнер с 3D просмотрщиком и панелью инструментов (появится при запуске на экране или доступен для отладки) -->
<div id="viewer-wrapper" class="absolute inset-0 pt-20 pb-6 px-4 flex flex-col justify-between hidden">
    <!-- Панель управления прозрачностью прямо поверх экрана -->
    <div class="flex flex-wrap gap-2 justify-center z-20">
        <button onclick="toggleTransparency(0)" class="px-4 py-2 bg-zinc-900/95 hover:bg-zinc-800 text-xs text-zinc-200 border border-zinc-700 backdrop-blur-md transition-all">
            Сделать деталь 1 прозрачной
        </button>
        <button onclick="resetTransparency()" class="px-4 py-2 bg-rose-900/80 hover:bg-rose-800 text-xs text-white border border-rose-700 backdrop-blur-md transition-all">
            Вернуть всё как было
        </button>
    </div>

    <div class="flex-1 w-full h-full relative">
        <model-viewer 
            id="ar-model-viewer"
            src="izbushka.glb" 
            scale="0.001 0.001 0.001" 
            ar
            ar-modes="scene-viewer quick-look webxr"
            ar-scale="fixed"
            camera-controls
            class="w-full h-full">
        </model-viewer>
    </div>
</div>

<script>
    const openArBtn = document.getElementById('open-ar-btn');
    const welcomeScreen = document.getElementById('welcome-screen');
    const viewerWrapper = document.getElementById('viewer-wrapper');
    const modelViewer = document.getElementById('ar-model-viewer');

    openArBtn.addEventListener('click', () => {
        // Пытаемся запустить AR режим на телефонах
        modelViewer.activateAR().catch((err) => {
            console.log("AR mode fallback/error:", err);
            // Если AR на устройстве не запустилось, показываем интерфейс на экране для теста
            welcomeScreen.classList.add('hidden');
            viewerWrapper.classList.remove('hidden');
        });
    });

    // Функция изменения прозрачности конкретного материала по индексу
    async function toggleTransparency(materialIndex) {
        await modelViewer.updateComplete;
        const materials = modelViewer.model.materials;
        if (materials && materials[materialIndex]) {
            const mat = materials[materialIndex];
            // Получаем текущий цвет и альфа-канал
            const currentColor = mat.pbrMetallicRoughness.baseColorFactor;
            // Если цвет уже полупрозрачный, делаем непрозрачным, и наоборот
            const newAlpha = currentColor[3] < 1.0 ? 1.0 : 0.2;
            mat.pbrMetallicRoughness.setBaseColorFactor([currentColor[0], currentColor[1], currentColor[2], newAlpha]);
        } else {
            alert('У модели не найдены раздельные материалы по этому индексу. Проверьте экспорт из SolidWorks.');
        }
    }

    // Возврат исходной непрозрачности всем материалам
    async function resetTransparency() {
        await modelViewer.updateComplete;
        const materials = modelViewer.model.materials;
if (materials) {
            materials.forEach(mat => {
                const c = mat.pbrMetallicRoughness.baseColorFactor;
                mat.pbrMetallicRoughness.setBaseColorFactor([c[0], c[1], c[2], 1.0]);
            });
        }
    }
</script>
