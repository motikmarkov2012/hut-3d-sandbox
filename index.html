<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Просмотр — Баба Яга</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

    <header class="w-full p-6 flex justify-between items-center border-b border-zinc-800/60">
        <h1 class="text-sm font-medium tracking-widest uppercase text-zinc-400">Команда «Баба Яга»</h1>
        <span class="text-xs text-orange-400 bg-orange-950/60 px-2.5 py-1 border border-orange-800/60">v1.8 (Фикс Android AR)</span>
    </header>

    <main id="welcome-screen" class="flex-1 flex flex-col items-center justify-center px-4">
        <div class="max-w-md text-center space-y-6">
            <h2 class="text-3xl font-light tracking-tight text-white">Избушка Бабы Яги в AR</h2>
            <p class="text-sm text-zinc-400 leading-relaxed">
                Нажмите кнопку ниже, чтобы запустить камеру и разместить модель.
            </p>
            <div class="pt-4">
                <button id="open-ar-btn" class="w-full sm:w-auto px-8 py-4 bg-orange-600 hover:bg-orange-500 text-white font-medium text-sm tracking-wide rounded-none transition-colors duration-200 shadow-lg shadow-orange-950/50">
                    Запустить камеру (Android & iOS)
                </button>
            </div>
            <!-- Ссылка-подсказка для Android, если AR не поддерживается -->
            <div id="android-warning" class="hidden text-xs text-amber-500/80 pt-2">
                Для работы AR на Android требуется приложение «Google Play Services for AR». Если камера не открылась, обновите его в Google Play.
            </div>
        </div>
    </main>

    <!-- Скрытый model-viewer с принудительным масштабом и Scene Viewer для Android -->
    <div class="hidden">
        <model-viewer 
            id="ar-model-viewer"
            src="izbushka.glb" 
            scale="0.001 0.001 0.001" 
            ar
            ar-modes="scene-viewer quick-look webxr"
            camera-controls>
        </model-viewer>
    </div>

    <script>
        const openArBtn = document.getElementById('open-ar-btn');
        const modelViewer = document.getElementById('ar-model-viewer');
        const androidWarning = document.getElementById('android-warning');

        // Определяем, Android ли это, чтобы показать подсказку при необходимости
        const isAndroid = /android/i.test(navigator.userAgent);
        if (isAndroid) {
            androidWarning.classList.remove('hidden');
        }

        openArBtn.addEventListener('click', () => {
            // Пытаемся активировать AR принудительно
            modelViewer.activateAR().catch((err) => {
                console.log("AR error:", err);
                if (isAndroid) {
                    alert('Не удалось запустить AR. Убедитесь, что у вас установлен Chrome и обновлены сервисы Google Play для AR.');
                } else {
                    alert('Откройте эту страницу в Safari на iPhone или Chrome на Android.');
                }
            });
        });
    </script>
</body>
</html>
