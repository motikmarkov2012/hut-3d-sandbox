<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Просмотр — Баба Яга</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

    <!-- Шапка -->
    <header class="w-full p-6 flex justify-between items-center border-b border-zinc-800/60">
        <h1 class="text-sm font-medium tracking-widest uppercase text-zinc-400">Команда «Баба Яга»</h1>
        <span class="text-xs text-emerald-400 bg-emerald-950/60 px-2.5 py-1 border border-emerald-800/60">v1.5 (Кнопка фиксации точки)</span>
    </header>

    <!-- Главный экран -->
    <main id="welcome-screen" class="flex-1 flex flex-col items-center justify-center px-4">
        <div class="max-w-md text-center space-y-6">
            <h2 class="text-3xl font-light tracking-tight text-white">Избушка Бабы Яги в AR</h2>
            <p class="text-sm text-zinc-400 leading-relaxed">
                Нажмите кнопку, наведите камеру на пол, дождитесь появления точки и нажмите специальную кнопку на экране, чтобы закрепить избушку.
            </p>
            <div class="pt-4">
                <!-- Яркая изумрудная кнопка версии v1.5 -->
                <button id="open-ar-btn" class="w-full sm:w-auto px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm tracking-wide rounded-none transition-colors duration-200 shadow-lg shadow-emerald-950/50">
                    Включить камеру с выбором точки
                </button>
            </div>
        </div>
    </main>

    <!-- 3D / AR просмотрщик -->
    <div class="hidden">
        <model-viewer 
            id="ar-model-viewer"
            src="izbushka.glb" 
            scale="0.3 0.3 0.3"
            ar
            ar-modes="webxr"
            ar-scale="fixed"
            camera-controls>
            
            <!-- Кастомная кнопка прямо внутри AR-режима для закрепления модели -->
            <button slot="ar-button" id="place-btn" class="hidden">
                Поставить избушку сюда
            </button>
        </model-viewer>
    </div>

    <!-- Скрипт запуска -->
    <script>
        const openArBtn = document.getElementById('open-ar-btn');
        const modelViewer = document.getElementById('ar-model-viewer');

        openArBtn.addEventListener('click', () => {
            if (modelViewer.canActivateAR) {
                modelViewer.activateAR();
            } else {
                alert('Режим WebXR AR не поддерживается на этом устройстве. Убедитесь, что вы открываете сайт со смартфона с поддержкой AR.');
            }
        });
    </script>
</body>
</html>
