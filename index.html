<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Баба Яга — 3D Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen w-screen overflow-hidden flex flex-col justify-between select-none">

    <!-- Минималистичная шапка -->
    <header class="w-full p-6 flex justify-between items-center border-b border-zinc-900 z-10">
        <h1 class="text-xs tracking-widest uppercase text-zinc-500">Баба Яга</h1>
        <span class="text-xs text-blue-500">v3.0</span>
    </header>

    <!-- Главный экран с одной кнопкой -->
    <main id="welcome-screen" class="flex-1 flex flex-col items-center justify-center px-4">
        <button id="open-ar-btn" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium tracking-wide transition-colors shadow-lg shadow-blue-950/50">
            Запустить камеру
        </button>
    </main>

    <!-- Экран просмотрщика (скрыт до запуска) -->
    <div id="viewer-container" class="absolute inset-0 pt-20 pb-6 px-4 flex flex-col justify-between hidden bg-zinc-950">
        
        <!-- Панель управления прозрачностью (появляется при клике на модель) -->
        <div id="control-panel" class="absolute top-24 left-1/2 -translate-x-1/2 z-20 bg-zinc-900/90 border border-zinc-800 px-5 py-3 backdrop-blur-md hidden flex items-center gap-4 shadow-xl">
            <span class="text-xs text-zinc-400 tracking-wider">Прозрачность: <span id="opacity-val">50</span>%</span>
            <input id="opacity-slider" type="range" min="10" max="100" value="50" class="accent-blue-500 cursor-pointer">
            <button id="close-panel" class="text-xs text-zinc-500 hover:text-white ml-2">✕</button>
        </div>

        <div class="flex-1 w-full h-full relative">
            <model-viewer 
                id="ar-model-viewer"
                src="izbushka.glb" 
                scale="0.001 0.001 0.001" 
                ar
                ar-modes="scene-viewer quick-look webxr"
                ar-scale="fixed"
                camera-controls
                class="w-full h-full cursor-pointer">
            </model-viewer>
        </div>
    </div>

    <script>
        const openArBtn = document.getElementById('open-ar-btn');
        const welcomeScreen = document.getElementById('welcome-screen');
        const viewerContainer = document.getElementById('viewer-container');
        const modelViewer = document.getElementById('ar-model-viewer');
        const controlPanel = document.getElementById('control-panel');
        const opacitySlider = document.getElementById('opacity-slider');
        const opacityVal = document.getElementById('opacity-val');
        const closePanelBtn = document.getElementById('close-panel');

        let isTransparent = false;

        // Запуск (пытаемся AR, если нет — открываем веб-просмотрщик с интераквом)
        openArBtn.addEventListener('click', () => {
            modelViewer.activateAR().catch(() => {
                welcomeScreen.classList.add('hidden');
                viewerContainer.classList.remove('hidden');
            });
        });

        // Клик по модели в обычном режиме браузера
        modelViewer.addEventListener('click', async () => {
            if (viewerContainer.classList.contains('hidden')) return;
            
            isTransparent = !isTransparent;
            const targetOpacity = isTransparent ? 0.5 : 1.0;
            
            await setModelOpacity(targetOpacity);
            
            if (isTransparent) {
                opacitySlider.value = 50;
                opacityVal.textContent = "50";
                controlPanel.classList.remove('hidden');
            } else {
                controlPanel.classList.add('hidden');
            }
        });

        // Управление слайдером прозрачности (от 10% до 100%)
        opacitySlider.addEventListener('input', async (e) => {
            const val = e.target.value;
            opacityVal.textContent = val;
            const alpha = val / 100;
            await setModelOpacity(alpha);
        });

        closePanelBtn.addEventListener('click', () => {
            controlPanel.classList.add('hidden');
        });

        // Функция изменения прозрачности всех материалов модели
        async function setModelOpacity(alpha) {
            await modelViewer.updateComplete;
            const materials = modelViewer.model?.materials;
            if (materials) {
                materials.forEach(mat => {
                    const c = mat.pbrMetallicRoughness.baseColorFactor;
                    mat.pbrMetallicRoughness.setBaseColorFactor([c[0], c[1], c[2], alpha]);
                });
            }
        }
    </script>
</body>
</html>
